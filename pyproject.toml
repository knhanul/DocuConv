[project]
name = "posid-document-converter"
version = "1.0.0"
description = "POSID document converter built with PySide6 and QML"
requires-python = ">=3.10,<3.15"
dependencies = [
    "PySide6>=6.10,<7",
    "pywin32>=310; platform_system == 'Windows'",
    "pypdfium2>=4.30,<6",
    "Pillow>=11,<13",
]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
